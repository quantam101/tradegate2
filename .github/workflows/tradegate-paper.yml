name: TradeGate Daily Paper Run

on:
  schedule:
    # Weekdays at 21:30 UTC (~5:30pm ET, after the US close) — one real-data
    # paper decision cycle per trading day.
    - cron: '30 21 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: tradegate-paper
  cancel-in-progress: false

jobs:
  daily-paper:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Daily paper run on real market data
        env:
          # Optional: if set, the Alpaca paper broker is available for
          # --execute runs. The daily ledger job itself is data-only and
          # places no orders.
          ALPACA_PAPER_KEY: ${{ secrets.ALPACA_PAPER_KEY }}
          ALPACA_PAPER_SECRET: ${{ secrets.ALPACA_PAPER_SECRET }}
        run: |
          python -m runtime.tradegate daily \
            --symbols SPY,QQQ,AAPL,MSFT,NVDA \
            --capital 10000

      - name: Momentum rotation paper run
        continue-on-error: true  # never block the daily ledger commit
        env:
          ALPACA_PAPER_KEY: ${{ secrets.ALPACA_PAPER_KEY }}
          ALPACA_PAPER_SECRET: ${{ secrets.ALPACA_PAPER_SECRET }}
        # Rebalances the Alpaca PAPER account (paper endpoint only) on
        # rebalance days when keys are configured; otherwise logs the
        # target portfolio data-only. Budget capped at $1,000.
        run: python -m runtime.tradegate rotation-paper --capital 1000 --execute

      - name: Commit daily ledger
        run: |
          git config user.name "tradegate-paper[bot]"
          git config user.email "tradegate-paper[bot]@users.noreply.github.com"
          git add -A data/tradegate/
          git diff --cached --quiet || git commit -m "chore(tradegate): daily paper ledger $(date -u +%F)"
          git push

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: daily-paper-${{ github.run_id }}
          path: |
            data/tradegate/daily/
            data/tradegate/rotation/
          retention-days: 90
